<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Flexi Educational Consult</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f4f7f9;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-card {
            background: white;
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            width: 100%;
            max-width: 350px;
        }

        .logo {
            width: 70px;
            margin-bottom: 15px;
        }

        h2 {
            color: #1a2a6c;
            margin-bottom: 5px;
            font-size: 1.5rem;
        }

        p {
            color: #777;
            font-size: 0.85rem;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #555;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5ee;
            border-radius: 12px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #6a11cb;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(
                135deg,
                #6a11cb 0%,
                #2575fc 100%
            );
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(106, 17, 203, 0.3);
        }
    </style>
</head>

<body>

    <div class="login-card">

        <img
            src="https://i.postimg.cc/0Qm3PLw5/1771700279759-2.jpg"
            alt="Flexi Logo"
            class="logo"
        >

        <h2>Admin Login</h2>

        <p>Center Access Portal</p>

        <form id="loginForm">

            <div class="input-group">
                <label>Email Address</label>

                <input
                    type="email"
                    id="email"
                    required
                    placeholder="admin@center.com"
                    autocomplete="username"
                >
            </div>

            <div class="input-group">
                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    required
                    placeholder="••••••••"
                    autocomplete="current-password"
                >
            </div>

            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                Verify & Login
            </button>

        </form>

    </div>


    <script type="module">

        /* =====================================================
           FIREBASE IMPORTS
        ===================================================== */

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

        import {
            getAuth,
            signInWithEmailAndPassword,
            signOut
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        import {
            getFirestore,
            doc,
            getDoc
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


        /* =====================================================
           FIREBASE CONFIGURATION
        ===================================================== */

        const firebaseConfig = {

            apiKey:
                "AIzaSyA0bM6pk1T1peGSS7quvFPEMOMuplnNRNM",

            authDomain:
                "waec2026jamb2027.firebaseapp.com",

            databaseURL:
                "https://waec2026jamb2027-default-rtdb.firebaseio.com",

            projectId:
                "waec2026jamb2027",

            storageBucket:
                "waec2026jamb2027.firebasestorage.app",

            messagingSenderId:
                "465373608641",

            appId:
                "1:465373608641:web:03d21cead99a3c9b65f240",

            measurementId:
                "G-XD6YTGGC30"

        };


        /* =====================================================
           INITIALIZE FIREBASE
        ===================================================== */

        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);

        const db = getFirestore(app);


        /* =====================================================
           LOGIN ELEMENTS
        ===================================================== */

        const loginForm =
            document.getElementById("loginForm");

        const loginBtn =
            document.getElementById("loginBtn");


        /* =====================================================
           LOGIN PROCESS
        ===================================================== */

        loginForm.addEventListener(
            "submit",
            async (e) => {

                e.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("password")
                        .value;


                loginBtn.disabled = true;

                loginBtn.innerText =
                    "Authenticating...";


                try {

                    /* =================================================
                       1. FIREBASE AUTHENTICATION
                    ================================================= */

                    const userCredential =
                        await signInWithEmailAndPassword(
                            auth,
                            email,
                            password
                        );


                    const user =
                        userCredential.user;

                    const uid =
                        user.uid;


                    /* =================================================
                       2. GET ADMIN RECORD FROM FIRESTORE
                    ================================================= */

                    const adminRef =
                        doc(
                            db,
                            "admins",
                            uid
                        );


                    const adminDoc =
                        await getDoc(adminRef);


                    /* =================================================
                       3. CHECK ADMIN RECORD
                    ================================================= */

                    if (!adminDoc.exists()) {

                        alert(
                            "Account found, but no Center Data exists in HQ Records."
                        );

                        await signOut(auth);

                        loginBtn.disabled = false;

                        loginBtn.innerText =
                            "Verify & Login";

                        return;
                    }


                    const data =
                        adminDoc.data();


                    /* =================================================
                       4. CREATE ADMIN SESSION
                    =================================================
                    
                    This contains everything home.html needs
                    immediately after login.

                    IMPORTANT:
                    This is NOT replacing Firebase Authentication.
                    Firebase Auth remains the real authentication
                    mechanism.

                    sessionStorage is only being used to pass the
                    authenticated admin's Firestore information
                    between index.html and home.html.
                    ================================================= */

                    const adminSession = {

                        /* Firebase Auth information */

                        uid:
                            uid,

                        email:
                            user.email || email,

                        displayName:
                            user.displayName || "",

                        /* Firestore admin information */

                        centerID:
                            data.centerID || "",

                        centerName:
                            data.centerName || "",

                        /* Useful metadata */

                        adminEmail:
                            email,

                        loginTime:
                            new Date().toISOString(),

                        sessionVersion:
                            "1.0"

                    };


                    /* =================================================
                       5. CLEAR ANY OLD SESSION
                    ================================================= */

                    sessionStorage.removeItem(
                        "fecAdminSession"
                    );


                    /* =================================================
                       6. SAVE COMPLETE SESSION
                    ================================================= */

                    sessionStorage.setItem(
                        "fecAdminSession",
                        JSON.stringify(adminSession)
                    );


                    /* =================================================
                       7. KEEP THE EXISTING SIMPLE VALUES TOO
                       
                       These are retained for compatibility with
                       existing pages that may already be using them.
                    ================================================= */

                    sessionStorage.setItem(
                        "centerID",
                        data.centerID || ""
                    );

                    sessionStorage.setItem(
                        "centerName",
                        data.centerName || ""
                    );

                    sessionStorage.setItem(
                        "adminEmail",
                        email
                    );


                    /* =================================================
                       8. OPTIONAL COMPATIBILITY COPY
                       
                       Existing pages may still be reading these from
                       localStorage, so we keep them for now.
                       
                       They are NOT being used as the authentication
                       mechanism.
                    ================================================= */

                    localStorage.setItem(
                        "centerID",
                        data.centerID || ""
                    );

                    localStorage.setItem(
                        "centerName",
                        data.centerName || ""
                    );

                    localStorage.setItem(
                        "adminEmail",
                        email
                    );


                    /* =================================================
                       9. REDIRECT TO DASHBOARD
                    ================================================= */

                    window.location.replace(
                        "home.html"
                    );

                }


                /* =====================================================
                   LOGIN ERROR
                ===================================================== */

                catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );


                    let message =
                        "Login Failed.";


                    if (
                        error &&
                        error.code
                    ) {

                        switch (error.code) {

                            case
                                "auth/invalid-credential":

                                message =
                                    "Invalid email or password.";

                                break;


                            case
                                "auth/user-not-found":

                                message =
                                    "No account was found with this email.";

                                break;


                            case
                                "auth/wrong-password":

                                message =
                                    "Incorrect password.";

                                break;


                            case
                                "auth/invalid-email":

                                message =
                                    "Please enter a valid email address.";

                                break;


                            case
                                "auth/too-many-requests":

                                message =
                                    "Too many login attempts. Please try again later.";

                                break;


                            case
                                "auth/network-request-failed":

                                message =
                                    "Network error. Please check your internet connection.";

                                break;


                            default:

                                message =
                                    error.message ||
                                    "Unable to complete login.";

                        }

                    }
                    else {

                        message =
                            error.message ||
                            "Unable to complete login.";

                    }


                    alert(
                        message
                    );


                    loginBtn.disabled =
                        false;

                    loginBtn.innerText =
                        "Verify & Login";

                }

            }
        );


        /* =====================================================
           SERVICE WORKER
           
           Existing functionality retained.
        ===================================================== */

        if (
            "serviceWorker" in navigator
        ) {

            window.addEventListener(
                "load",
                () => {

                    navigator.serviceWorker
                        .register(
                            "./service-worker.js"
                        )

                        .then(() => {

                            console.log(
                                "F.E.C Service Worker registered"
                            );

                        })

                        .catch(
                            (error) => {

                                console.error(
                                    "Service Worker registration failed:",
                                    error
                                );

                            }
                        );

                }
            );

        }

    </script>

</body>
</html>
