<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're Offline</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; width: 100%; height: 100%;
      font-family: Arial, sans-serif; background: #ffffff;
    }
    body {
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 24px;
    }
    .container { width: 100%; max-width: 380px; }
    .icon {
      width: 110px; height: 110px; margin: 0 auto 25px;
      border-radius: 50%; background: #075E54;
      display: flex; align-items: center; justify-content: center;
      font-size: 48px; box-shadow: 0 12px 30px rgba(0,0,0,0.12);
    }
    h1 { margin: 0 0 12px; font-size: 28px; color: #111; }
    p { margin: 0; line-height: 1.6; color: #777; font-size: 15px; }
    button {
      margin-top: 28px; border: none; background: #075E54;
      color: white; padding: 14px 28px; border-radius: 12px;
      font-size: 15px; font-weight: bold; cursor: pointer;
    }
    button:active { transform: scale(0.97); }
    .brand { margin-top: 20px; font-size: 12px; color: #999; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>
      We couldn't connect to F.E.C Admin Suite.<br>
      Please check your internet connection and try again.
    </p>
    <button id="retryBtn" onclick="tryAgain()">🔄 Try Again</button>
    <div class="brand">F.E.C Admin Suite</div>
  </div>

  <script>
    const HOME_URL = "https://flexisystems2000.github.io/F.E.CAdminpanel/";

    function tryAgain() {
      const btn = document.getElementById("retryBtn");
      btn.disabled = true;
      btn.innerText = "Checking...";

      // Real network check (navigator.onLine is unreliable)
      fetch(HOME_URL, { method: "HEAD", cache: "no-store" })
        .then(() => {
          window.location.replace(HOME_URL);
        })
        .catch(() => {
          btn.disabled = false;
          btn.innerText = "🔄 Try Again";
          alert("You're still offline. Please check your internet connection.");
        });
    }

    window.addEventListener("online", () => {
      setTimeout(() => {
        window.location.replace(HOME_URL);
      }, 500);
    });
  </script>
</body>
</html>
