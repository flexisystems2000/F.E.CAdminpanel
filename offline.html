<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>You're Offline</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 380px;
        }

        .icon {
            width: 110px;
            height: 110px;

            margin: 0 auto 25px;

            border-radius: 50%;

            background: #075E54;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 48px;

            box-shadow:
                0 12px 30px rgba(0,0,0,.12);
        }

        h1 {
            margin: 0 0 12px;

            font-size: 28px;

            color: #111111;
        }

        p {
            margin: 0;

            line-height: 1.6;

            color: #777777;

            font-size: 15px;
        }

        button {
            margin-top: 28px;

            border: none;

            background: #075E54;

            color: white;

            padding: 14px 28px;

            border-radius: 12px;

            font-size: 15px;

            font-weight: bold;
        }

        button:active {
            transform: scale(.97);
        }

        .brand {
            margin-top: 20px;

            font-size: 12px;

            color: #999999;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">
            📡
        </div>

        <h1>
            You're Offline
        </h1>

        <p>
            We couldn't connect to F.E.C Admin Suite.
            Please check your internet connection and try again.
        </p>

        <button onclick="retry()">
            🔄 Try Again
        </button>

        <div class="brand">
            F.E.C Admin Suite
        </div>

    </div>

    <script>

        function retry() {

            if (navigator.onLine) {

                window.location.href =
                    "./";

            } else {

                alert(
                    "You're still offline. Please check your internet connection."
                );

            }
        }

    </script>

</body>
</html>
