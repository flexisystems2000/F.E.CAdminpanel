<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - User Reports</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f8; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h2 { color: #003366; }
        .report-card { background: #fff; padding: 15px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .badge { display: inline-block; background: #ffc107; color: #000; padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
        .badge-danger { background: #dc3545; color: #fff; }
        .meta { font-size: 0.85rem; color: #666; margin-top: 5px; }
        .reason { margin: 10px 0; font-style: italic; background: #f9f9f9; padding: 10px; border-left: 3px solid #003366; }
        .actions { margin-top: 10px; }
        .btn-resolve { background: #2E8B57; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Admin Reports Panel</h2>
        <div id="reports-list">Loading submitted reports...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyA0bM6pk1T1peGSS7quvFPEMOMuplnNRNM", 
            authDomain: "flexieduconsult.com.ng", 
            projectId: "waec2026jamb2027" 
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const listEl = document.getElementById('reports-list');

        async function loadReports() {
            try {
                const q = query(collection(db, "reports"), orderBy("timestamp", "desc"));
                const snap = await getDocs(q);
                
                if (snap.empty) {
                    listEl.innerHTML = "<p>No reports submitted yet.</p>";
                    return;
                }

                listEl.innerHTML = "";
                snap.forEach((docSnap) => {
                    const data = docSnap.data();
                    const reportId = docSnap.id;
                    
                    const card = document.createElement('div');
                    card.className = 'report-card';
                    card.innerHTML = `
                        <div>
                            <strong>Target:</strong> ${data.reportedName} (${data.reportedEmail})
                            <span class="${data.status === 'resolved' ? 'badge' : 'badge badge-danger'}">${data.status || 'pending'}</span>
                        </div>
                        <div class="meta">Reported by UID: ${data.reporterUid}</div>
                        <div class="reason">"${data.reason}"</div>
                        <div class="actions">
                            ${data.status !== 'resolved' ? `<button class="btn-resolve" onclick="resolveReport('${reportId}')">Mark as Resolved</button>` : 'Resolved'}
                        </div>
                    `;
                    listEl.appendChild(card);
                });
            } catch(e) {
                console.error(e);
                listEl.innerHTML = "<p>Error loading reports.</p>";
            }
        }

        window.resolveReport = async function(id) {
            await updateDoc(doc(db, "reports", id), { status: "resolved" });
            loadReports();
        };

        loadReports();
    </script>
</body>
</html>
